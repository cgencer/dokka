user www-data www-data;
worker_processes 4;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections  2048;
    multi_accept        on;
    use epoll;
}

http {
    server_tokens       off;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    sendfile            on;
    charset             UTF-8;
    default_type        application/octet-stream;
    access_log          /var/log/nginx/access.log;
    error_log           /var/log/nginx/error_log;

    include             /home/modules/basic/mime.types;
    include             /home/modules/gzip.conf;
    include             /home/modules/letsencrypt.conf;
    include             /home/config/sites/*.conf;
}