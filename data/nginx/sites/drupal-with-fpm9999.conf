server {
	listen				80;
	listen				[::]:80;

	server_name			dev.piyononline.localhost;
	root 				/var/www/html;
	index				index.php index.html;

	client_max_body_size 100M;
	access_log 			/var/log/nginx/dev.akademi.access.log;
	error_log 			/var/log/nginx/dev.akademi.error.log;

	location @drupal {
		fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
		include 		/home/modules/fastcgi/fastcgi_params.conf;
		fastcgi_intercept_errors 			on;
		fastcgi_index  	index.php;
		fastcgi_param 	SCRIPT_FILENAME 	$document_root$fastcgi_script_name;
		fastcgi_param	PATH_INFO 			$fastcgi_path_info;
		fastcgi_param 	QUERY_STRING 		$query_string;
		fastcgi_param	PATH_TRANSLATED 	$document_root$fastcgi_path_info;
		fastcgi_pass   	kuzguni_drupalX_fpm:9999;
	}

	location @static {
        access_log 		off;
        expires 		max;
        tcp_nodelay 	off;
        log_not_found   off;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
	}
    location / {
		add_header 'Access-Control-Allow-Origin' '*';
		add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';

		location ~* \.+(css|js|jpe?g|gif|ico|png|html|xml|otf|ttf|eot|woff2?|svg)[\?/].* {
			root 	/home/assets;
			try_files $uri $uri/ @static;
		}
	    location ~ .*\.php$ {			try_files $uri $uri/ @drupal;}
	    location ~* ^/.well-known/ { 	allow all;}
		location ^~ /.bzr {				return 404;}
		location ^~ /.git {				return 404;}
		location ^~ /.hg {				return 404;}
		location ^~ /.svn {				return 404;}
		location ^~ /.cvs {				return 404;}
		location ^~ /patches {			return 404;}
		location ^~ /backup {			return 404;}
		location = /robots.txt {		access_log off; try_files $uri @drupal;}
		location = /rss.xml {			access_log off; try_files $uri @drupal;}
		location = /sitemap.xml {		access_log off; try_files $uri @drupal;}

	}
}
